server {
    listen 0.0.0.0:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css image/svg+xml text/plain application/json;
    gzip_min_length 1000;

    location = /frontend-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /aibim-logo.svg {
        try_files /aibim-logo.svg =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /free-tools {
        return 301 /;
    }

    location ~ ^/free-tools/(.*)$ {
        return 301 /$1$is_args$args;
    }

    location = /llms.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # HTML documents are proxied to the backend, which substitutes the
    # SSR_HEAD/SSR_MAIN placeholders in the shell with per-route title,
    # canonical, OG/Twitter and JSON-LD metadata. Serving index.html from this
    # container returns the shell verbatim and every route looks identical to a
    # crawler.
    #
    # This is done here, in the container that actually receives document
    # requests, rather than only in the stack edge proxy: the shared aibim edge
    # proxy is deployed independently of this repository and routes documents
    # straight to this container, so a rule that only lives in the stack proxy
    # never runs in production.
    #
    # Static assets are matched by the more specific blocks above and are still
    # served locally from disk.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://ai-supply-chain-trust-backend:8080;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
        # If the backend is unreachable, fall back to the un-injected shell so
        # the site keeps rendering rather than returning 502.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @shell;
    }

    location @shell {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
