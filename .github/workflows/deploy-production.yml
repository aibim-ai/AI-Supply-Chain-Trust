name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ai-supply-chain-trust-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production stack
    runs-on: [self-hosted, ai-repo-trust]
    timeout-minutes: 30
    env:
      DEPLOY_DIR: /opt/ai-repo-trust
      ENV_FILE: /opt/ai-repo-trust/.env.prod
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Deploy and verify
        run: .github/deploy/production/deploy-prod.sh "$DEPLOY_DIR" "$ENV_FILE"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify public browser release gate
        working-directory: frontend
        env:
          PUBLIC_BASE_URL: https://ai-supply-chain-trust.aibim.ai
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:public-release
